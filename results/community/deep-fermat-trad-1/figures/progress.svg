<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Verified targets for the money">
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e6e5e1;
         --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --dead: #c9c7c0; }
