  .c2 { stroke: var(--s2); } .f2 { fill: var(--s2); }
  .c3 { stroke: var(--s3); } .f3 { fill: var(--s3); }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .label { font-size: 12px; font-weight: 700; }
  .t1 { fill: var(--s1); } .t2 { fill: var(--s2); } .t3 { fill: var(--s3); }
