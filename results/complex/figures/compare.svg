<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 620 280" width="620" height="280" role="img" aria-label="Hardest level published">
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e6e5e1;
         --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --dead: #c9c7c0; }
  @media (prefers-color-scheme: dark) {
