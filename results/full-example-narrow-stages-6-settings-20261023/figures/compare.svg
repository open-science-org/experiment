<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 620 228" width="620" height="228" role="img" aria-label="Hardest level published">
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e6e5e1;
         --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --dead: #c9c7c0; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --grid: #34332f;
           --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --dead: #4a4945; }
  }
  .bg { fill: var(--surface); }
  text { fill: var(--ink); font-family: Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 700; }
  .sub, .tick, .axis { fill: var(--ink-2); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--ink-2); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .c1 { stroke: var(--s1); } .f1 { fill: var(--s1); }
  .c2 { stroke: var(--s2); } .f2 { fill: var(--s2); }
  .c3 { stroke: var(--s3); } .f3 { fill: var(--s3); }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .label { font-size: 12px; font-weight: 700; }
  .t1 { fill: var(--s1); } .t2 { fill: var(--s2); } .t3 { fill: var(--s3); }
</style><rect class="bg" width="620" height="228" rx="8"/>
<text class="title" x="16" y="26">Hardest level published</text>
<rect x="16" y="38" width="12" height="10" rx="2" style="fill:var(--s2)"/><text class="label t2" x="33" y="47">OSO</text>
<rect x="67" y="38" width="12" height="10" rx="2" style="fill:var(--s1)"/><text class="label t1" x="84" y="47">Traditional</text>
<rect x="174" y="38" width="12" height="10" rx="2" style="fill:var(--dead)"/><text class="label " x="191" y="47">other</text>
<text class="tick" x="222" y="73" text-anchor="end">No flow-back, immediate</text>
<rect x="230" y="62" width="320.0" height="16" rx="3" style="fill:var(--dead)"><title>No flow-back, immediate: 6.0</title></rect>
<text class="label " x="556" y="74">6.0</text>
<text class="tick" x="222" y="99" text-anchor="end">OSO</text>
<rect x="230" y="88" width="319.5" height="16" rx="3" style="fill:var(--s2)"><title>OSO: 5.99</title></rect>
<text class="label t2" x="555.4666666666667" y="100">5.99</text>
<text class="tick" x="222" y="125" text-anchor="end">OSO (choice)</text>
<rect x="230" y="114" width="307.2" height="16" rx="3" style="fill:var(--s2)"><title>OSO (choice): 5.76</title></rect>
<text class="label t2" x="543.2" y="126">5.76</text>
<text class="tick" x="222" y="151" text-anchor="end">No flow-back, choice</text>
<rect x="230" y="140" width="306.7" height="16" rx="3" style="fill:var(--dead)"><title>No flow-back, choice: 5.75</title></rect>
<text class="label " x="542.6666666666667" y="152">5.75</text>
<text class="tick" x="222" y="177" text-anchor="end">Traditional</text>
<rect x="230" y="166" width="19.2" height="16" rx="3" style="fill:var(--s1)"><title>Traditional: 0.36</title></rect>
<text class="label t1" x="255.2" y="178">0.36</text>
<text class="tick" x="222" y="203" text-anchor="end">Flow-back, finished-only</text>
<rect x="230" y="192" width="19.2" height="16" rx="3" style="fill:var(--dead)"><title>Flow-back, finished-only: 0.36</title></rect>
<text class="label " x="255.2" y="204">0.36</text>
</svg>