id: alpha-psi
title: 'Where sharing becomes rational: α × scoop risk ψ'
description: >-
  Agent's-choice visibility. ψ is how much publishing a lemma raises a rival's chance of winning the
  target below it.
question: "At which α and scoop risk ψ does sharing become worth it to agents?"
compare: "α × ψ, agents choosing what to publish"
fixed: "the field, agents and budget"
measure: sharing
better: higher
seeds: 100
set:
  rules.visibility: { kind: choice }
factors:
  - { name: ψ, path: behaviour.psi, values: [0.5, 0.25, 0.1] }
  - { name: α, path: rules.alpha, values: [1, 0.8, 0.5, 0.3, 0.1] }
