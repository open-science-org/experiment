# Lab size 2026-10-28: 24 agents, growth 1
id: simple-ideas-6x8-p2-len3g1-comp0-7-lab-size-24-agents-scaling-20261028
title: Lab size, from everyone alone to one lab of everyone, on a graph where deeper ideas are
  harder by 1 bit per level
description: "The simple model with 24 identical agents on a graph where deeper ideas are harder by
  1 bit per level, 6 levels × 8 ideas, 2 parents each, composition 0.7; each graph run 5 times.
  Traditional rules (α = 1, nothing published before a target), with agents in equal labs of 1
  (alone), 2, 3, 4, 6, 8, 12 or 24 (one lab of everyone); lab mates share every proof at once,
  privately. Against OSO across the whole field at α = 0.8 and 0.2. Held fixed: equal money per
  agent every round (f = 0), no flat mint, a knowledge reward of 1 per new bit flowing back with α,
  no validation."
