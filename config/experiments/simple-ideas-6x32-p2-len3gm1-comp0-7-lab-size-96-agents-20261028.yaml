# Lab size at scale 2026-10-28: 96 agents, growth -1
id: simple-ideas-6x32-p2-len3gm1-comp0-7-lab-size-96-agents-20261028
title: Lab size with 96 agents, deeper ideas easier (1 bit fewer per level)
description: "The simple model with 96 identical agents on a generated idea graph of 6 levels × 32
  ideas (2 ideas per agent), 2 parents each, composition 0.7, deeper ideas easier (1 bit fewer per
  level), 8 targets on the top level; each graph run 3 times. Traditional rules (α = 1, nothing
  published before a target), with agents in equal labs of 1, 2, 4, 8, 16, 32, 48, 96; lab mates
  share every proof at once, privately. Against OSO across the whole field at α = 0.8 and 0.2. Each
  agent makes 1 attempt per round; the funder pays until half the targets are solved, and the
  measure is the money spent by then. Held fixed: equal money per agent every round, no flat mint, a
  knowledge reward of 1 per new bit flowing back with α, no validation."
