id: sensitivity
title: How much the traditional-vs-OSO gap depends on the gamer and the compute loop
description: >-
  Traditional and OSO (immediate) under four variants. Under traditional rules only target winners and
  spammers earn early, so the compute loop can hand the gaming agent most of the budget.
question: "How much of OSO's lead depends on the gaming agent and the compute loop?"
compare: "traditional and OSO, under four variants"
fixed: "the field and budget"
measure: frontier
better: higher
seeds: 100
factors:
  - name: variant
    levels:
      - { label: 'default (ρ = 0.5, θ = 0.5)' }
      - { label: 'no compute loop (ρ = 0)', set: { budget.allocation.rho: 0 } }
      - { label: 'strong screen (θ = 0.9)', set: { rules.screen: 0.9 } }
      - { label: no gamer, set: { agents.mix.gamer: 0 } }
  - name: setting
    levels:
      - { label: Traditional, preset: traditional }
      - { label: OSO (immediate), preset: oso }
columns: [frontier, reachTarget, speed, roi, cost, spend, productivity, breadth, waste, credit, sharing, hoarded, gamerShare, trivialSpend]
