# Difficulty that does not strictly follow level (2026-10-26).
id: simple-ideas-6x8-p2-len3g2-comp0-7-difficulty-follows-level-20261026
title: Does it matter whether difficulty follows level?
description: "The simple model on a generated idea graph (6 levels × 8 ideas, 2 parents each,
  sequences of 3 bits growing by 2 per level, composition 0.7); each run draws its own graph. α, β
  and how strictly difficulty follows level (1 strictly, 0.8 mostly, 0.5 loosely, 0 not at all)
  vary; the mix of easy and hard ideas is the same at every setting. Held fixed: 12 identical
  agents, equal money each round (f = 0), no flat mint, a knowledge reward of 1 per new bit flowing
  back with α, no validation (θ = 0), a budget of 1200."
