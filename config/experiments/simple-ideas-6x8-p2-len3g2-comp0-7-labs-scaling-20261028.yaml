# A stronger traditional (labs) 2026-10-28: growth 2
id: simple-ideas-6x8-p2-len3g2-comp0-7-labs-scaling-20261028
title: "A stronger traditional: labs that share inside, on the default graph (deeper ideas harder by
  2 bits per level)"
description: "The simple model on the default graph (deeper ideas harder by 2 bits per level), 6
  levels × 8 ideas, 2 parents each, composition 0.7; each graph run 5 times. Traditional rules (α =
  1, nothing published before a target), with the 12 agents alone, in 2 labs of 6, in 3 labs of 4,
  in one lab of 9 with 3 alone, or in one lab of all 12; lab mates share every proof at once,
  privately. Money is equal per agent, so a bigger lab has more. Against OSO at α = 0.8 and 0.2.
  Held fixed: 12 identical agents, equal money every round (f = 0), no flat mint, a knowledge reward
  of 1 per new bit flowing back with α, no validation."
