# Designed in the experiment app.
id: my-experiment
title: my-experiment
description: 'Designed in the app on the field "An abstract research field"
  (spaces/abstract-field.yaml): Traditional vs OSO (immediate) vs OSO (choice) vs Flow-back,
  finished-only; with α, retention = 0.65, p₀, chance at level 1 = 0.25. α and c apply to the OSO
  (flow-back) settings only.'
seeds: 50
set:
  budget:
    X: 1200
  success:
    p0: 0.25
factors:
  - name: setting
    levels:
      - label: Traditional
        preset: traditional
      - label: OSO (immediate)
        preset: oso
        set:
          rules.alpha: 0.65
      - label: OSO (choice)
        preset: osoChoice
        set:
          rules.alpha: 0.65
      - label: Flow-back, finished-only
        preset: creditOnly
        set:
          rules.alpha: 0.65
columns:
  - frontier
  - reachTarget
  - cost
  - sharing
  - targetsSolved
