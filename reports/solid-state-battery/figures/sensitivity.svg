  .bg { fill: var(--surface); }
  text { fill: var(--ink); font-family: Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 700; }
  .sub, .tick, .axis { fill: var(--ink-2); font-size: 12px; }
