<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="An example tree, levels from left to right: results A and B at level 1, C at level 2 built on A and B, and target T at level 3 built on C and B. Arrows go from a parent to the result built on it, labelled with the link weight.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker>
  </defs>
  <rect width="700" height="420" rx="10" fill="#ffffff"/>
  <!-- levels, left to right -->
  <g font-size="12" fill="#6b6b6b" text-anchor="middle">
    <rect x="70" y="20" width="150" height="320" rx="8" fill="#fafaf8"/>
    <rect x="275" y="20" width="150" height="320" rx="8" fill="#fafaf8"/>
    <rect x="480" y="20" width="150" height="320" rx="8" fill="#fafaf8"/>
    <text x="145" y="42" font-weight="700" fill="#2b2b2b">level 1</text><text x="145" y="58">p = 0.5</text>
    <text x="350" y="42" font-weight="700" fill="#2b2b2b">level 2</text><text x="350" y="58">p = 0.3</text>
    <text x="555" y="42" font-weight="700" fill="#2b2b2b">level 3</text><text x="555" y="58">p = 0.18</text>
  </g>
  <!-- links: parent y to the result x built on it, labelled w -->
  <g stroke="#6b6b6b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="170" y1="128" x2="324" y2="170"/>
    <line x1="170" y1="262" x2="324" y2="190"/>
    <line x1="376" y1="186" x2="508" y2="226"/>
    <line x1="171" y1="276" x2="508" y2="252"/>
  </g>
  <g font-size="12" fill="#2b2b2b">
    <text x="222" y="134">w = 50%</text>
    <text x="184" y="228">w = 50%</text>
    <text x="420" y="194">w = 62.5%</text>
    <text x="330" y="284">w = 37.5%</text>
  </g>
  <!-- nodes -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">
    <circle cx="145" cy="120" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="145" y="125">A</text>
    <circle cx="145" cy="270" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="145" y="275">B</text>
    <circle cx="350" cy="180" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="350" y="185">C</text>
    <rect x="510" y="214" width="90" height="48" rx="8" fill="#2b2b2b"/><text x="555" y="244" fill="#ffffff">T</text>
  </g>
  <!-- what each result is -->
  <g font-size="11.5" fill="#4a4a4a" text-anchor="middle">
    <text x="145" y="160">a root</text>
    <text x="145" y="310">a root; parent of C and T</text>
    <text x="350" y="220">built on A and B</text>
    <text x="555" y="282" font-weight="700" fill="#2b2b2b">target: prize B<tspan font-size="9" dy="3">T</tspan><tspan dy="-3"> = 16</tspan></text>
    <text x="555" y="298">built on C and B</text>
  </g>
  <text x="350" y="336" font-size="11.5" fill="#6b6b6b" text-anchor="middle">harder to the right →</text>
  <!-- the prize's waterfall at α = 0.8 -->
  <g font-size="12">
    <rect x="70" y="360" width="560" height="40" rx="6" fill="#f6f6f4"/>
    <text x="84" y="385" fill="#2b2b2b"><tspan font-weight="700">Prize 16 at α = 0.8:</tspan> T keeps 12.8 · C gets 2.0, keeps 1.6 · B 1.2 + 0.2 = 1.4 · A 0.2</text>
  </g>
</svg>
