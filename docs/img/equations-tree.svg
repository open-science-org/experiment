<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="An example tree of ideas, levels from left to right. Level 1: z1, z2 and y2. Level 2: y1, built on z1 and z2. Level 3: x, built on y1 and y2, with a prize of 16; the others have no prize. Arrows go from a parent to the idea built on it, labelled with the link weight.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker>
  </defs>
  <rect width="700" height="450" rx="10" fill="#ffffff"/>
  <!-- levels, left to right -->
  <g font-size="12" fill="#6b6b6b" text-anchor="middle">
    <rect x="70" y="20" width="150" height="350" rx="8" fill="#fafaf8"/>
    <rect x="275" y="20" width="150" height="350" rx="8" fill="#fafaf8"/>
    <rect x="480" y="20" width="150" height="350" rx="8" fill="#fafaf8"/>
    <text x="145" y="42" font-weight="700" fill="#2b2b2b">level 1</text><text x="145" y="58">p = 0.5</text>
    <text x="350" y="42" font-weight="700" fill="#2b2b2b">level 2</text><text x="350" y="58">p = 0.3</text>
    <text x="555" y="42" font-weight="700" fill="#2b2b2b">level 3</text><text x="555" y="58">p = 0.18</text>
  </g>
  <!-- links: parent to the idea built on it, labelled w -->
  <g stroke="#6b6b6b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="170" y1="104" x2="324" y2="150"/>
    <line x1="170" y1="200" x2="324" y2="168"/>
    <line x1="376" y1="168" x2="529" y2="224"/>
    <line x1="170" y1="302" x2="529" y2="246"/>
  </g>
  <g font-size="12" fill="#2b2b2b">
    <text x="226" y="112">w = 50%</text>
    <text x="214" y="204">w = 50%</text>
    <text x="440" y="178">w = 62.5%</text>
    <text x="320" y="300">w = 37.5%</text>
  </g>
  <!-- ideas: all the same kind of node, named with the formulas' own letters -->
  <g font-size="16" font-style="italic" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#2b2b2b">
    <circle cx="145" cy="96" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="145" y="102">z<tspan font-size="11" dy="4">1</tspan></text>
    <circle cx="145" cy="200" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="145" y="206">z<tspan font-size="11" dy="4">2</tspan></text>
    <circle cx="145" cy="306" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="145" y="312">y<tspan font-size="11" dy="4">2</tspan></text>
    <circle cx="350" cy="160" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="350" y="166">y<tspan font-size="11" dy="4">1</tspan></text>
    <circle cx="555" cy="236" r="24" fill="#eef1f5" stroke="#9aa3ad" stroke-width="2"/><text x="555" y="242">x</text>
  </g>
  <!-- what each idea is -->
  <g font-size="11.5" fill="#4a4a4a" text-anchor="middle">
    <text x="145" y="136">B = 0</text>
    <text x="145" y="240">B = 0</text>
    <text x="145" y="346">B = 0</text>
    <text x="350" y="200">B = 0 · built on z₁, z₂</text>
    <text x="555" y="276" font-weight="700" fill="#2b2b2b">B = 16</text>
    <text x="555" y="292">built on y₁, y₂</text>
  </g>
  <text x="350" y="362" font-size="11.5" fill="#6b6b6b" text-anchor="middle">harder to the right →</text>
  <!-- the prize's flow-back at α = 0.8 -->
  <g font-size="12">
    <rect x="70" y="390" width="560" height="40" rx="6" fill="#f6f6f4"/>
    <text x="84" y="415" fill="#2b2b2b"><tspan font-weight="700">x's prize 16 at α = 0.8:</tspan> x keeps 12.8 · y₁ gets 2.0, keeps 1.6 · y₂ 1.2 · z₁ 0.2 · z₂ 0.2</text>
  </g>
</svg>
