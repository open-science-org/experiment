<path class="line c3" d="M64.0 146.4 L570.0 146.4"/>
<circle class="dot f3" cx="64.0" cy="146.4" r="4.5"><title>12 agents, each alone: 12× at depth (levels, log scale) 10</title></circle>
<circle class="dot f3" cx="570.0" cy="146.4" r="4.5"><title>12 agents, each alone: 12× at depth (levels, log scale) 80</title></circle>
<text class="label t1" x="582" y="134.08">Traditional ÷ OSO: 12.9×</text>
<text class="label t3" x="582" y="150.39999999999998">12 agents, each alone: 12×</text>
</svg>