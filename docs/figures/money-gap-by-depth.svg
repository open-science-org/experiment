<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The gap grows with depth">
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e6e5e1;
         --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --dead: #c9c7c0; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --grid: #34332f;
           --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --dead: #4a4945; }
  }
  .bg { fill: var(--surface); }
  text { fill: var(--ink); font-family: Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 700; }
  .sub, .tick, .axis { fill: var(--ink-2); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--ink-2); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .c1 { stroke: var(--s1); } .f1 { fill: var(--s1); }
  .c2 { stroke: var(--s2); } .f2 { fill: var(--s2); }
  .c3 { stroke: var(--s3); } .f3 { fill: var(--s3); }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .label { font-size: 12px; font-weight: 700; }
  .t1 { fill: var(--s1); } .t2 { fill: var(--s2); } .t3 { fill: var(--s3); }
</style><rect class="bg" width="760" height="420" rx="8"/>
<text class="title" x="64" y="30">The gap grows with depth</text>
<text class="sub" x="64" y="50">Money to solve half the targets, traditional ÷ OSO; each step equally hard</text>
<line class="line c1" x1="64" y1="70" x2="82" y2="70"/><text class="label t1" x="88" y="74">Traditional ÷ OSO</text>
<line class="line c3" x1="210.2" y1="70" x2="228.2" y2="70"/><text class="label t3" x="234.2" y="74">12 agents, each alone</text>
<line class="grid" x1="64" x2="570" y1="364" y2="364"/>
<text class="tick" x="56" y="368" text-anchor="end">0×</text>
