<text class="tick" x="56" y="96" text-anchor="end">15×</text>
<line class="base" x1="64" x2="570" y1="364" y2="364"/>
<text class="tick" x="64" y="382" text-anchor="middle">10</text>
<text class="tick" x="232.6666666666667" y="382" text-anchor="middle">20</text>
<text class="tick" x="401.33333333333337" y="382" text-anchor="middle">40</text>
<text class="tick" x="570" y="382" text-anchor="middle">80</text>
<text class="axis" x="317" y="408" text-anchor="middle">Depth (levels, log scale)</text>
<text class="axis" transform="translate(16 228) rotate(-90)" text-anchor="middle">traditional ÷ OSO</text>
<path class="line c1" d="M64.0 222.6 L232.7 220.7 L401.3 195.4 L570.0 130.1"/>
<circle class="dot f1" cx="64.0" cy="222.6" r="4.5"><title>Traditional ÷ OSO: 7.8× at depth (levels, log scale) 10</title></circle>
<circle class="dot f1" cx="232.7" cy="220.7" r="4.5"><title>Traditional ÷ OSO: 7.9× at depth (levels, log scale) 20</title></circle>
<circle class="dot f1" cx="401.3" cy="195.4" r="4.5"><title>Traditional ÷ OSO: 9.3× at depth (levels, log scale) 40</title></circle>
